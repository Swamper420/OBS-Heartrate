<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HR Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Orbitron:wght@800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            font-family: 'Outfit', 'Orbitron', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #overlay-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 14px;
            user-select: none;
            padding: 20px;
        }

        #bpm-value {
            font-size: 160px;
            font-weight: 900;
            line-height: 0.9;
            font-variant-numeric: tabular-nums;
            letter-spacing: -4px;
            color: rgba(255, 255, 255, 0.4);
            will-change: color, text-shadow;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
        }

        #bpm-unit {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            align-self: flex-end;
            margin-bottom: 16px;
            transition: color 0.6s ease;
        }
    </style>
</head>
<body>

<div id="overlay-container">
    <span id="bpm-value">--</span>
    <span id="bpm-unit">BPM</span>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG & ZONES
═══════════════════════════════════════════ */
const RENDER_DELAY = 1500; // Delay to sync pulses with incoming stream timeline

const ZONES = [
    { min: 0,   max: 60,  rgb: [75, 185, 255] },  // Rest (Cool Blue)
    { min: 60,  max: 90,  rgb: [0, 215, 255]  },  // Easy (Cyan)
    { min: 90,  max: 120, rgb: [0, 255, 130]  },  // Fat Burn (Neon Green)
    { min: 120, max: 140, rgb: [255, 215, 0]  },  // Cardio (Golden Yellow)
    { min: 140, max: 160, rgb: [255, 78, 0]   },  // Hard (Bright Orange)
    { min: 160, max: 999, rgb: [255, 0, 50]   }   // Max (Intense Red)
];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let displayRgb = [140, 150, 170];
let targetRgb  = [140, 150, 170];
let pulse      = 0.0;
let lastTime   = Date.now();
let beats      = [];

/* ═══════════════════════════════════════════
   DOM REFS
═══════════════════════════════════════════ */
const bpmEl  = document.getElementById('bpm-value');
const unitEl = document.getElementById('bpm-unit');

/* ═══════════════════════════════════════════
   COLOR HELPERS
═══════════════════════════════════════════ */
function lerpRgb(from, to, t) {
    return from.map((v, i) => v + (to[i] - v) * t);
}

function toRgb(c, a) {
    const [r, g, b] = c.map(Math.round);
    return a == null ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a})`;
}

function interpolateZoneColor(bpm) {
    if (!bpm || bpm <= 0) return [140, 150, 170];
    for (let i = ZONES.length - 2; i >= 0; i--) {
        if (bpm >= ZONES[i].min) {
            const lo = ZONES[i], hi = ZONES[i + 1];
            const t  = Math.max(0, Math.min(1, (bpm - lo.min) / (hi.min - lo.min)));
            return lo.rgb.map((v, j) => v + (hi.rgb[j] - v) * t);
        }
    }
    return ZONES[0].rgb.slice();
}

function triggerPulse() {
    pulse = 1.0;
}

/* ═══════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════ */
function loop() {
    const now = Date.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    // Decay pulse intensity smoothly (half-life ~200ms)
    pulse = Math.max(0, pulse - dt * 3.5);

    // Smoothly interpolate display color toward zone color
    displayRgb = lerpRgb(displayRgb, targetRgb, 0.05);

    // Compute pulse flash color (shifts toward bright white glow on pulse)
    const pFactor = Math.pow(pulse, 0.7);
    const curRgb = [
        Math.min(255, displayRgb[0] + (255 - displayRgb[0]) * pFactor * 0.95),
        Math.min(255, displayRgb[1] + (255 - displayRgb[1]) * pFactor * 0.95),
        Math.min(255, displayRgb[2] + (255 - displayRgb[2]) * pFactor * 0.95)
    ];

    const baseColStr = toRgb(curRgb);
    
    // Dynamic text shadow glow expanding on beat pulse
    const innerGlow   = Math.round(12 + pFactor * 35);
    const outerGlow   = Math.round(25 + pFactor * 65);
    const glowOpacity = (0.4 + pFactor * 0.5).toFixed(2);
    
    const zoneGlowStr  = toRgb(displayRgb, glowOpacity);
    const flashGlowStr = toRgb(curRgb, glowOpacity);

    bpmEl.style.color = baseColStr;
    bpmEl.style.textShadow = `
        0 0 ${innerGlow}px ${flashGlowStr},
        0 0 ${outerGlow}px ${zoneGlowStr}
    `;

    unitEl.style.color = toRgb(displayRgb, 0.4);

    requestAnimationFrame(loop);
}

/* ═══════════════════════════════════════════
   WEBSOCKET
═══════════════════════════════════════════ */
function connect() {
    const ws = new WebSocket('ws://localhost:8765');

    ws.onmessage = function(ev) {
        const d   = JSON.parse(ev.data);
        const bpm = d.bpm;
        const now = Date.now();

        targetRgb = interpolateZoneColor(bpm);
        bpmEl.textContent = bpm;

        /* Beat Pulses */
        if (d.rrs && d.rrs.length > 0) {
            let bt = now;
            for (let i = d.rrs.length - 1; i >= 0; i--) {
                let isDup = false;
                for (let j = 0; j < beats.length; j++) {
                    if (Math.abs(beats[j] - bt) < 28) { isDup = true; break; }
                }
                if (!isDup) {
                    beats.push(bt);
                    const renderDelay = Math.max(0, bt + RENDER_DELAY - now);
                    setTimeout(triggerPulse, renderDelay);
                }
                bt -= d.rrs[i] * 1000;
            }
        } else {
            // Fallback pulse if no RR intervals present
            triggerPulse();
        }

        beats = beats.filter(t => t > now - 13000);
    };

    ws.onclose = function() {
        targetRgb = [140, 150, 170];
        setTimeout(connect, 2000);
    };

    ws.onerror = function() {
        ws.close();
    };
}

/* ═══════════════════════════════════════════
   BOOT
═══════════════════════════════════════════ */
connect();
requestAnimationFrame(loop);
</script>
</body>
</html>
